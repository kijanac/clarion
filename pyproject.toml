[project]
name = "clarion"
version = "0.1.0"
description = "A self-hosted team intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "structlog>=24.0",
    "httpx>=0.27,<1",
    "openai>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "croniter>=3.0,<4",
    "ddgs>=9.0",
    "readability-lxml>=0.8.4",
    "markdownify>=1.2",
    "pyyaml>=6.0",
    "watchfiles>=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "pytest-mock>=3.14",
    "ruff>=0.9",
    "ty>=0.0.1a5",
]

[project.scripts]
clarion = "clarion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clarion"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "RUF",   # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["clarion"]

[tool.ty.environment]
python-version = "3.11"
