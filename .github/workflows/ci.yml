name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      risk_tier: ${{ steps.risk.outputs.tier }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Risk assessment
        id: risk
        run: |
          tier=$(uv run python scripts/check_risk.py --tier-only)
          echo "tier=$tier" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

  checks:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Types
        run: uvx ty check

      - name: Tests
        run: uv run pytest

      - name: Architecture
        run: uv run python scripts/check_layers.py

  evidence:
    needs: preflight
    if: needs.preflight.outputs.risk_tier == 'critical'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate evidence
        run: uv run python scripts/check_evidence.py

  quality:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect quality metrics
        run: |
          uv run python scripts/collect_quality.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/quality.jsonl
          git diff --cached --quiet || git commit -m "quality: snapshot after ${{ github.sha }}"
          git push
